name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)publish a release for"
        required: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Determine release tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Rename APK for release
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk "release-out/cooled-${{ steps.tag.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release-out/*.apk
          body: |
            Debug-signed APK built from this tag by CI (`.github/workflows/release.yml`).

            This is a from-scratch, dependency-clean reimplementation of the
            CoolLED BLE LED matrix controller app - not affiliated with the
            original vendor. See docs/APK_PORT_STATUS.md for exactly what is
            and isn't verified byte-exact against the original APK yet.

            The APK is signed with the Android debug keystore (not a release
            key), so it installs directly via `adb install` or by opening it
            on-device, but Android will treat upgrades/reinstalls the same
            way it treats any debug build.
