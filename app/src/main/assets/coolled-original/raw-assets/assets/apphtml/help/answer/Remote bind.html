				"vi": "1. Xác nhận rằng thiết bị đã được bật và điều khiển từ xa có thể hoạt động bình thường. <br>2. Nhấn và giữ nút \"<b>Rẽ trái</b>\" trên điều khiển từ xa trong khoảng 5 giây. Điều khiển màn hình sẽ hiển thị \"<b>Biểu tượng đóng bìa</b>\", cho biết rằng ràng buộc thành công. <br>3 Nhấn và giữ nút \"<b>Rẽ phải</b>\" trên điều khiển từ xa trong khoảng 5 giây, màn hình sẽ hiển thị \"<b>Biểu tượng hủy liên kết</b>\", cho biết việc hủy liên kết thành công. . <br><br><b>Mẹo</b>:<br>1. Khoảng cách điều khiển tối đa của điều khiển từ xa là 5 mét, vui lòng sử dụng trong phạm vi hiệu quả. <br>2. Sau khi liên kết thành công, chỉ có điều khiển từ xa được liên kết mới có thể điều khiển thiết bị. <br>",
				"th": "1. ตรวจสอบให้แน่ใจว่าอุปกรณ์เปิดอยู่และรีโมทคอนโทรลสามารถทำงานได้ตามปกติ <br>2. กดปุ่ม \"<b>เลี้ยวซ้าย</b>\" บนรีโมทคอนโทรลค้างไว้ประมาณ 5 วินาที ตัวควบคุมหน้าจอจะแสดง \"<b>ไอคอนเข้าเล่ม</b>\" เพื่อระบุว่า การผูกมัดสำเร็จ <br>3. กดปุ่ม \"<b>เลี้ยวขวา</b>\" บนรีโมทคอนโทรลค้างไว้ประมาณ 5 วินาที จากนั้นหน้าจอจะแสดง \"<b>ไอคอนการปลดสาย</b>\" แสดงว่าการปลดสายสำเร็จ . <br><br><b>เคล็ดลับ</b>:<br>1. ระยะการควบคุมสูงสุดของรีโมทคอนโทรลคือ 5 เมตร โปรดใช้ภายในระยะที่มีประสิทธิภาพ <br>2. หลังจากที่การเชื่อมโยงสำเร็จแล้ว มีเพียงรีโมทคอนโทรลที่ถูกผูกไว้เท่านั้นที่สามารถควบคุมอุปกรณ์ได้ <br>",
