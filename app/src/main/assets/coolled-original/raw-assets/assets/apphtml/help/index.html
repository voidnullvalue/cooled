			questionItem.addEventListener("click",
			function() {
				// 点击问题时跳转到问题详情页面，并传递问题ID和语言参数
				window.location.href = "answer/" + question.id + ".html?language=" + language + "&dev_name=" + devName + "&height=" + height + "&width=" + width + "&pl=" + pl;
			});

			questionList.appendChild(questionItem);
		});
		
		// 恢复上次记录的滚动位置
		var scrollPosition = sessionStorage.getItem('scrollPosition');
		if (scrollPosition) {
			questionList.scrollTop = scrollPosition;
		}

		// 监听滚动事件，并记录滚动位置
		questionList.addEventListener('scroll', function() {
			sessionStorage.setItem('scrollPosition', questionList.scrollTop);
		});
	</script>
</body>
</html>
