				"zh-CN": "音乐律动需要开启文件存储和麦克风权限才能正常使用。Android用户会自动查找手机中可用的音乐文件。对于iPhone用户，需要使用电脑手动把音乐添加到APP中，操作如下：<br><br><b>1.通过Mac传输音乐文件</b><br> &nbsp;&nbsp;a)使用USB将iPhone连接到Mac。<br> &nbsp;&nbsp;b)在Mac上的Finder侧栏中，选择您的iPhone。【注意】如果要使用\"Finder\"传输文件，则需要macOS Catalina。如果您运行的是macOS的早期版本，请使用iTunes传输文件。<br> &nbsp;&nbsp;c)在\"Finder\"窗口的顶部，单击\"文件\"，然后将所选音乐文件从另一个窗口拖到列表中的App名称为【CoolLED1248】的位置，即可完成添加音乐文件的操作。要从iPhone删除文件，请选择应用名称下的文件，按 Command-Delete，然后单击\"删除\"。<br><br><b>2.通过Window PC传输音乐文件</b><br> &nbsp;&nbsp;a)使用USB将iPhone连接到Windows PC。<br> &nbsp;&nbsp;b)在Windows PC上的iTunes中，单击iTunes窗口左上方附近的iPhone按钮。<br> &nbsp;&nbsp;c)单击文件共享，在列表中选择应用程序(CoolLED1248)，然后将文件从电脑传输到iPhone;单击添加，选择要传输的文件，然后单击添加。 要/iPhone删除文件，请选择文件，按Delete键，然后单击 Delete。<br>",
				"en": "Music Rhythm needs to enable file storage and microphone permissions to work properly. Android users automatically find music files available in their phones. For iPhone users, you need to use a computer to manually add music to the APP, the operation is as follows:<br><br><b>1. Transfer music files through Mac</b><br> &nbsp;&nbsp;a) Connect iPhone to Mac using USB. <br> &nbsp;&nbsp;b) On the Mac, in the Finder sidebar, select your iPhone. 【Note】If you want to use \"Finder\" to transfer files, you need macOS Catalina. If you're running an earlier version of macOS, use iTunes to transfer files. <br> &nbsp;&nbsp;c) At the top of the \"Finder\" window, click \"File\", and then drag the selected music file from another window to the position where the App name is [CoolLED1248] in the list, and the adding music file can be completed operate. To delete a file from your iPhone, select the file under the app name, press Command-Delete, and click Delete. <br><br><b>2. Transfer music files via Window PC</b><br> &nbsp;&nbsp;a) Connect iPhone to Windows PC using USB. <br> &nbsp;&nbsp;b) In iTunes on your Windows PC, click the iPhone button near the top left of the iTunes window. <br> &nbsp;&nbsp;c) Click File Sharing, select the application (CoolLED1248) in the list, and transfer files from your computer to iPhone; click Add, select the files you want to transfer, and click Add. To iPhone delete a file, select the file, press the Delete key, and click Delete. <br>",
				"ja": "Music Rhythm が適切に機能するには、ファイル ストレージとマイクのアクセス許可を有効にする必要があります。 Android ユーザーは、携帯電話で利用可能な音楽ファイルを自動的に見つけます。 iPhone ユーザーの場合、コンピュータを使用して手動 で音楽を APP に追加する必要があります。操作は次のとおりです:<br><br><b>1. Mac 経由で音楽ファイルを転送</b><br> &nbsp;&nbsp;a) USB を使用して iPhone を Mac に接続します。 <br> &nbsp;&nbsp;b) Mac の Finder サイドバーで iPhone を選択します。 【注意】「Finder」を使用して ファイルを転送するには、macOS Catalinaが必要です。以前のバージョンの macOS を実行している場合は、iTunes を使用してファイルを転送します。 <br> &nbsp;&nbsp;c) 「Finder」ウィンドウの上部にある「ファイル」をクリックし、別のウィンドウから選択した音楽ファイルをリスト内のアプリ名が[CoolLED1248]の位置にドラッグし、音楽ファイルを追加します操作を完了することができます。 iPhone からファイルを削除するには、アプリ名の下にあるファイルを選択し、Command キーを押しながら Delete キーを押して、[削除] をクリックします。 <br><br><b>2. Windows PC 経由で音楽ファイルを転送</b><br> &nbsp;&nbsp;a) USB を使用して iPhone を Windows PC に接続します。 <br> &nbsp;&nbsp;b) Windows PC の iTunes で、iTunes ウィンドウの左上近くにある iPhone ボタンをクリックします。 <br> &nbsp;&nbsp;c) [ファイル共有] をクリックし、リストからアプリケーション (CoolLED1248) を選択し、コンピュータから iPhone にファイルを転送します。[追加] をクリックし、転送するファイルを選択して、[追加] をクリックします。 /iPhone でファイルを削除するには、ファ イルを選択し、Delete キーを押して、[削除] をクリックします。 <br>",
				"fr": "Music Rhythm doit activer le stockage de fichiers et les autorisations du microphone pour fonctionner correctement. Les utilisateurs d'Android trouvent automatiquement les fichiers musicaux disponibles sur leur téléphone. Pour les utilisateurs d'iPhone, vous devez utiliser un ordinateur pour ajouter manuellement de la musique à l'APP, l'opération est la suivante :<br><br><b>1. Transférer des fichiers musicaux via Mac</b><br> &nbsp;&nbsp;a) Connectez l'iPhone au Mac via USB. <br> &nbsp;&nbsp;b) Sur Mac, dans la barre latérale du Finder, sélectionnez votre iPhone. 【Remarque】 Si vous souhaitez utiliser \"Finder\" pour transférer des fichiers, vous avez besoin de macOS Catalina. Si vous utilisez une version antérieure de macOS, utilisez iTunes pour transférer des fichiers. <br> &nbsp;&nbsp;c) En haut de la fenêtre \"Finder\", cliquez sur \"Fichier\", puis faites glisser le fichier musical sélectionné d'une autre fenêtre vers la position où le nom de l'application est [CoolLED1248] dans la liste, et le fichier musical ajouté peut être complété fonctionner. Pour supprimer un fichier de votre iPhone, sélectionnez le fichier sous le nom de l'application, appuyez sur Commande-Supprimer, puis cliquez sur Supprimer. <br><br><b>2. Transférer des fichiers musicaux via un PC Windows</b><br> &nbsp;&nbsp;a) Connectez l'iPhone au PC Windows via USB. <br> &nbsp;&nbsp;b) Dans iTunes sur votre PC Windows, cliquez sur le bouton iPhone en haut à gauche de la fenêtre iTunes. <br> &nbsp;&nbsp;c) Cliquez sur Partage de fichiers, sélectionnez l'application (CoolLED1248) dans la liste et transférez les fichiers de votre ordinateur vers l'iPhone ; cliquez sur Ajouter, sélectionnez les fichiers que vous souhaitez transférer, puis cliquez sur Ajouter. Pour /iPhone supprimer un fichier, sélectionnez le fichier, appuyez sur la touche Suppr, puis cliquez sur Supprimer. <br>",
				"de": "Damit Music Rhythm ordnungsgemäß funktioniert, müssen Dateispeicherung und Mikrofonberechtigungen aktiviert sein. Android-Benutzer finden automatisch Musikdateien, die auf ihren Telefonen verfügbar sind. Für iPhone-Benutzer müssen Sie einen Computer verwenden, um manuell Musik zur APP hinzuzufügen. Der Vorgang ist wie folgt:<br><br><b>1. Übertragen Sie Musikdateien über den Mac</b><br> &nbsp;&nbsp;a) Verbinden Sie das iPhone über USB mit dem Mac. <br> &nbsp;&nbsp;b) Wählen Sie auf dem Mac in der Finder-Seitenleiste Ihr iPhone aus. 【Hinweis】Wenn Sie „Finder“ zum Übertragen von Dateien verwenden möchten, benötigen Sie macOS Catalina. Wenn Sie eine frühere Version von macOS verwenden, verwenden Sie iTunes zum Übertragen von Dateien. <br> &nbsp;&nbsp;c) Klicken Sie oben im „Finder“-Fenster auf „Datei“ und ziehen Sie dann die ausgewählte Musikdatei aus einem anderen Fenster an die Position in der Liste, an der der App-Name [CoolLED1248] lautet, und fügen Sie die Musikdatei hinzu abgeschlossen werden kann. Um eine Datei von Ihrem iPhone zu löschen, wählen Sie die Datei unter dem App-Namen aus, drücken Sie die Tastenkombination „Befehl-Entf“ und klicken Sie auf „Löschen“. <br><br><b>2. Musikdateien über einen Windows-PC übertragen</b><br> &nbsp;&nbsp;a) Verbinden Sie das iPhone über USB mit einem Windows-PC. <br> &nbsp;&nbsp;b) Klicken Sie in iTunes auf Ihrem Windows-PC auf die iPhone-Schaltfläche oben links im iTunes-Fenster. <br> &nbsp;&nbsp;c) Klicken Sie auf „Dateifreigabe“, wählen Sie die Anwendung (CoolLED1248) in der Liste aus und übertragen Sie Dateien von Ihrem Computer auf das iPhone. Klicken Sie auf „Hinzufügen“, wählen Sie die Dateien aus, die Sie übertragen möchten, und klicken Sie auf „Hinzufügen“. Um eine Datei zu löschen, wählen Sie die Datei aus, drücken Sie die Entf-Taste und klicken Sie auf „Löschen“. <br>",
				"ko": "Music Rhythm이 제대로 작동하려면 파일 저장 및 마이크 권한을 활성화해야 합니다. Android 사용자는 휴대폰에서 사용 가능한 음악 파일을 자동으로 찾습니다. iPhone 사용자의 경우 컴퓨터를 사용하여 앱에 수동으로 음악을 추가해야 하며 작업은 다음과 같습니다.<br><br><b>1. Mac을 통해 음악 파일 전송</b><br> &nbsp;&nbsp;a) USB를 사용하여 iPhone을 Mac에 연결합니다. <br> &nbsp;&nbsp;b) Mac의 Finder 사이드바에서 iPhone을 선택합니다. 【참고】\"Finder\"를 사용하여 파일을 전송하려면 macOS Catalina가 필요합니다. 이전 버전의 macOS를 실행 중인 경우 iTunes를 사용하여 파일을 전송합니다. <br> &nbsp;&nbsp;c) \"Finder\" 창 상단의 \"파일\"을 클릭한 후 다른 창에서 선택한 음악 파일을 목록에서 앱 이름이 [CoolLED1248]인 위치로 드래그하면 음악 파일이 추가됩니다. 작동을 완료할 수 있습니다. iPhone에서 파일을 삭제하려면 앱 이름 아래에 있는 파일을 선택하고 Command-Delete를 누른 다음 삭제를 클릭하십시오. <br><br><b>2. Window PC로 음악 파일 전송</b><br> &nbsp;&nbsp;a) USB를 이용하여 iPhone과 Windows PC를 연결합니다. <br> &nbsp;&nbsp;b) Windows PC의 iTunes에서 iTunes 창의 왼쪽 상단 근처에 있는 iPhone 버튼을 클릭합니다. <br> &nbsp;&nbsp;c) 파일 공유를 클릭하고 목록에서 응용 프로그램(CoolLED1248)을 선택한 다음 컴퓨터에서 iPhone으로 파일을 전송하고 추가를 클릭하여 전송할 파일을 선택한 다 음 추가를 클릭합니다. /iPhone에서 파일을 삭제하려면 파일을 선택하고 Delete 키를 누른 다음 삭제를 클릭합니다. <br>",
				"it": "Music Rhythm deve abilitare l'archiviazione dei file e le autorizzazioni del microfono per funzionare correttamente. Gli utenti Android trovano automaticamente i file musicali disponibili nei loro telefoni. Per gli utenti di iPhone, è necessario utilizzare un computer per aggiungere manualmente musica all'APP, l'operazione è la seguente:<br><br><b>1. Trasferisci file musicali tramite Mac</b><br> &nbsp;&nbsp;a) Collega l'iPhone al Mac tramite USB. <br> &nbsp;&nbsp;b) Sul Mac, nella barra laterale del Finder, seleziona il tuo iPhone. 【Nota】Se vuoi usare \"Finder\" per trasferire file, hai bisogno di macOS Catalina. Se utilizzi una versione precedente di macOS, usa iTunes per trasferire i file. <br> &nbsp;&nbsp;c) Nella parte superiore della finestra \"Finder\", fare clic su \"File\", quindi trascinare il file musicale selezionato da un'altra finestra nella posizione in cui il nome dell'app è [CoolLED1248] nell'elenco e aggiungere il file musicale può essere completato operare. Per eliminare un file dal tuo iPhone, seleziona il file sotto il nome dell'app, premi Comando-Elimina e fai clic su Elimina. <br><br><b>2. Trasferisci file musicali tramite Windows PC</b><br> &nbsp;&nbsp;a) Collega l'iPhone al PC Windows tramite USB. <br> &nbsp;&nbsp;b) In iTunes sul tuo PC Windows, fai clic sul pulsante iPhone nella parte superiore sinistra della finestra di iTunes. <br> &nbsp;&nbsp;c) Fare clic su Condivisione file, selezionare l'applicazione (CoolLED1248) nell'elenco e trasferire i file dal computer all'iPhone; fare clic su Aggiungi, selezionare i file che si desidera trasferire e fare clic su Aggiungi. Per /iPhone eliminare un file, selezionare il file, premere il tasto Elimina e fare clic su Elimina. <br>",
				"pt": "O Music Rhythm precisa habilitar o armazenamento de arquivos e as permissões de microfone para funcionar corretamente. Os usuários do Android encontram automaticamente os arquivos de música disponíveis em seus telefones. Para usuários do iPhone, você precisa usar um computador para adicionar música manualmente ao APP, a operação é a seguinte:<br><br><b>1. Transfira arquivos de música através do Mac</b><br> &nbsp;&nbsp;a) Conecte o iPhone ao Mac usando USB. <br> &nbsp;&nbsp;b) No Mac, na barra lateral do Finder, selecione seu iPhone. 【Observação】Se você deseja usar o \"Finder\" para transferir arquivos, precisa do macOS Catalina. Se você estiver executando uma versão anterior do macOS, use o iTunes para transferir arquivos. <br> &nbsp;&nbsp;c) Na parte superior da janela \"Finder\", clique em \"Arquivo\" e arraste o arquivo de música selecionado de outra janela para a posição onde o nome do aplicativo é [CoolLED1248] na lista, e o arquivo de música pode ser adicionado operar. Para excluir um arquivo do seu iPhone, selecione o arquivo com o nome do aplicativo, pressione Comando + Excluir e clique em Excluir. <br><br><b>2. Transfira arquivos de música via Windows PC</b><br> &nbsp;&nbsp;a) Conecte o iPhone ao Windows PC usando USB. <br> &nbsp;&nbsp;b) No iTunes em seu PC com Windows, clique no botão iPhone próximo ao canto superior esquerdo da janela do iTunes. <br> &nbsp;&nbsp;c) Clique em Compartilhamento de Arquivos, selecione o aplicativo (CoolLED1248) na lista e transfira os arquivos do seu computador para o iPhone; clique em Adicionar, selecione os arquivos que deseja transferir e clique em Adicionar. Para /iPhone excluir um arquivo, selecione o arquivo, pressione a tecla Delete e clique em Excluir. <br>",
				"es": "Music Rhythm necesita habilitar el almacenamiento de archivos y los permisos de micrófono para funcionar correctamente. Los usuarios de Android encuentran automáticamente archivos de música disponibles en sus teléfonos. Para los usuarios de iPhone, debe usar una computadora para agregar música manualmente a la aplicación. La operación es la siguiente:<br><br><b>1. Transfiere archivos de música a través de Mac</b><br> &nbsp;&nbsp;a) Conecta el iPhone a Mac usando USB. <br> &nbsp;&nbsp;b) En la Mac, en la barra lateral del Finder, seleccione su iPhone. 【Nota】Si desea utilizar \"Finder\" para transferir archivos, necesita macOS Catalina. Si está ejecutando una versión anterior de macOS, use iTunes para transferir archivos. <br> &nbsp;&nbsp;c) En la parte superior de la ventana \"Finder\", haga clic en \"Archivo\" y luego arrastre el archivo de música seleccionado desde otra ventana a la posición donde el nombre de la aplicación es [CoolLED1248] en la lista, y el archivo de música puede ser agregado operar. Para eliminar un archivo de su iPhone, seleccione el archivo bajo el nombre de la aplicación, presione Comando-Eliminar y haga clic en Eliminar. <br><br><b>2. Transferir archivos de música a través de Windows PC</b><br> &nbsp;&nbsp;a) Conecte el iPhone a Windows PC mediante USB. <br> &nbsp;&nbsp;b) En iTunes en su PC con Windows, haga clic en el botón iPhone cerca de la parte superior izquierda de la ventana de iTunes. <br> &nbsp;&nbsp;c) Haga clic en Compartir archivos, seleccione la aplicación (CoolLED1248) en la lista y transfiera archivos desde su computadora al iPhone; haga clic en Agregar, seleccione los archivos que desea transferir y haga clic en Agregar. Para/iPhone eliminar un archivo, seleccione el archivo, presione la tecla Eliminar y haga clic en Eliminar. <br>",
				"zh-TW": "音樂律動需要開啟文件存儲和麥克風權限才能正常使用。 Android用戶會自動查找手機中可用的音樂文件。對於iPhone用戶，需要使用電腦手動把音樂添加到APP中，操作如下：<br><br><b>1.通過Mac傳輸音樂文件</b><br> &nbsp;&nbsp;a)使用USB將iPhone連接到Mac。 <br> &nbsp;&nbsp;b)在Mac上的Finder側欄中，選擇您的iPhone。 【注意】如果要使用\"Finder\"傳輸文件，則需要macOS Catalina。如果您運行的是macOS的早期版本，請使用iTunes傳輸文件。 <br> &nbsp;&nbsp;c)在\"Finder\"窗口的頂部，單擊\"文件\"，然後將所選音樂文件從另一個窗口拖到列表中的App名稱為【CoolLED1248】的位置，即可完成添加音樂文件的操作。要從iPhone刪除文件，請選擇應用名稱下的文件，按 Command-Delete，然後單擊\"刪除\"。 <br><br><b>2.通過Window PC傳輸音樂文件</b><br> &nbsp;&nbsp;a)使用USB將iPhone連接到Windows PC。 <br> &nbsp;&nbsp;b)在Windows PC上的iTunes中，單擊iTunes窗口左上方附近的iPhone按鈕。 <br> &nbsp;&nbsp;c)單擊文件共享，在列表中選擇應用程序(CoolLED1248)，然後將文件從電腦傳輸到iPhone;單擊添加，選擇要傳輸的文件，然後單擊添加。要/iPhone刪除文件，請選擇文件，按Delete鍵，然後單擊 Delete。 <br>",
				"ru": "Для правильной работы Music Rhythm необходимо разрешить доступ к хранилищу файлов и микрофону. Пользователи Android автоматически на ходят музыкальные файлы, доступные на их телефонах. Пользователям iPhone необходимо вручную добавить музыку в приложение с помощью компьютера. Эта операция выглядит следующим образом:<br><br><b>1. Перенос музыкальных файлов через Mac<br> а) Подключите iPhone к Mac через USB. <br> &nbsp;&nbsp;b) На Mac на боковой панели Finder выберите свой iPhone. 【Примечание】Если вы хотите использовать «Finder» для передачи файлов, вам потребуется macOS Catalina. Если вы используете более раннюю версию macOS, используйте iTunes для передачи файлов. <br> &nbsp;&nbsp;c) В верхней части окна «Finder» нажмите «Файл», а затем перетащите выбранный музыкальный файл из другого окна в положение, где имя приложения [CoolLED1248] в списке, и добавлен ие музыкального файла может быть завершена работа. Чтобы удалить файл с вашего iPhone, выберите файл под именем приложения, нажмите Command-Delete и нажмите «Удалить». <br><br><b>2. Перенос музыкальных файлов через ПК с Windows<br> а) Подключите iPhone к ПК с Windows через USB. <br> &nbsp;&nbsp;b) В iTunes на ПК с Windows нажмите кнопку iPhone в верхнем левом углу окна iTunes. <br> &nbsp;&nbsp;c) Нажмите «Общий доступ к файлам», выберите в списке приложение (CoolLED1248)  и перенесите файлы с компьютера на iPhone; нажмите «Добавить», выберите файлы, которые хотите передать, и нажмите «Добавить». Чтобы /iPhone удалить файл, выберите файл, нажмите клавишу «Удалить» и нажмите «Удалить». <br>",
				"vi": "Nhịp điệu âm nhạc cần cho phép lưu trữ tệp và quyền micrô để hoạt động bình thường. Người dùng Android tự động tìm các tệp nhạc có sẵn trong điện thoại của họ. Đối với người dùng iPhone, bạn cần sử dụng máy tính để thêm nhạc vào APP theo cách thủ công, thao tác như sau:<br><br><b>1. Chuyển file nhạc qua Mac</b><br> &nbsp;&nbsp;a) Kết nối iPhone với Mac bằng USB. <br> &nbsp;&nbsp;b) Trên máy Mac, trong thanh bên Finder, hãy chọn iPhone của bạn. [Lưu ý] Nếu bạn muốn sử dụng \"Finder\" để truyền tệp, bạn cần có macOS Catalina. Nếu bạn đang chạy phiên bản macOS cũ hơn, hãy sử dụng iTunes để truyền tệp.<br> &nbsp;&nbsp;c) Ở đầu cửa sổ \"Finder\", nhấp vào \"Tệp\", sau đó kéo tệp nhạc đã chọn từ cửa sổ khác đến vị trí có tên Ứng dụng là [CoolLED1248] trong danh sách và thêm nhạc tập tin có thể được hoàn thành hoạt động. Để xóa tệp khỏi iPhone của bạn, hãy chọn tệp dưới tên ứng dụng, nhấn Command-Delete và nhấp vào Xóa.<br><br><b>2. Transfer music files via Window PC</b><br> &nbsp;&nbsp;a) Kết nối iPhone với PC Windows bằng USB. <br> &nbsp;&nbsp;b) Trong iTunes trên PC chạy Windows của bạn, hãy nhấp vào nút iPhone ở gần phía trên cùng bên trái của cửa sổ iTunes.<br> &nbsp;&nbsp;c) Nhấp vào Chia sẻ tệp, chọn ứng dụng (CoolLED1248) trong danh sách và chuyển tệp từ máy tính sang iPhone; nhấp vào Thêm, chọn tệp bạn muốn chuyển và nhấp vào Thêm. Để iPhone xóa một tệp, hãy chọn tệp, nhấn phím Xóa và nhấp vào Xóa.<br>",
				"th": "Music Rhythm จำเป็นต้องเปิดใช้งานการจัดเก็บไฟล์และการอนุญาตไมโครโฟนเพื่อให้ทำงานได้อย่างถูกต้อง ผู้ใช้ Android จะค้นหาไฟล์เพลงที่มีอยู่ในโทรศัพท์ของตนโดยอัตโนมัติ สำหรับผู้ใช้ iPhone คุณต้องใช้คอมพิวเตอร์เพื่อเพิ่มเพลงลงใน APP ด้วยตนเอง การดำเนินการมีดังนี้:<br><br><b>1. ถ่ายโอนไฟล์เพลงผ่าน Mac</b><br> &nbsp;&nbsp;a) เชื่อมต่อ iPhone กับ Mac โดยใช้ USB<br> &nbsp;&nbsp;b) บน Mac ในแถบด้านข้าง Finder ให้เลือก iPhone ของคุณ 【หมายเหตุ】หากคุณต้องการใช้ \"Finder\" เพื่อถ่ายโอนไฟล์ คุณต้องมี macOS Catalina หากคุณใช้ macOS เวอร์ชั่นก่อนหน้า ให้ใช้ iTunes เพื่อถ่ายโอนไฟล์ <br> &nbsp;&nbsp;c) ที่ด้านบนของหน้าต่าง \"Finder\" คลิก \"ไฟล์\" จากนั้นลากไฟล์เพลงที่เลือกจากหน้าต่างอื่นไปยังตำแหน่งที่ชื่อแอปเป็น [CoolLED1248] ในรายการ และสามารถเพิ่มไฟล์เพลงได้ ดำเนินการให้แล้วเสร็จ หากต้องการลบไฟล์ออกจาก iPhone ของคุณ ให้เลือกไฟล์ใต้ชื่อแอพ กด Command-Delete แล้วคลิก Delete <br><br><b>2. ถ่ายโอนไฟล์เพลงผ่าน Window PC</b><br> &nbsp;&nbsp;a) Connect iPhone to Windows PC using USB. <br> &nbsp;&nbsp;b) ใน iTunes บน PC ที่ใช้ Windows ของคุณ ให้คลิกปุ่ม iPhone ใกล้กับด้านซ้ายบนสุดของหน้าต่าง iTunes <br> &nbsp;&nbsp;c) คลิกการแชร์ไฟล์ เลือกแอปพลิเคชัน (CoolLED1248) ในรายการ และถ่ายโอนไฟล์จากคอมพิวเตอร์ของคุณไปยัง iPhone คลิกเพิ่ม เลือกไฟล์ที่คุณต้องการถ่ายโอน แล้วคลิกเพิ่ม หากต้องการลบไฟล์ใน iPhone ให้เลือกไฟล์ กดปุ่ม Delete แล้วคลิก Delete<br>",
