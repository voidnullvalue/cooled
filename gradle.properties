org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# NOTE: aarch64 proot/Termux dev environments (no native linux-aarch64 aapt2 -
# Google only publishes linux/x86_64, osx, windows) need
# android.aapt2FromMavenOverride pointed at toolchain/aapt2-bin/aapt2 (a
# qemu-x86_64-static wrapper around the official x86_64 aapt2). That does NOT
# belong in this committed file: real CI runners and most contributors'
# machines are already x86_64/arm64-with-native-aapt2 and must not have this
# override forced on them. Set it in your own $GRADLE_USER_HOME/gradle.properties
# (usually ~/.gradle/gradle.properties) instead if you need it. See docs/TESTING.md.
