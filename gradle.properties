org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# aarch64 proot/Termux dev environments have no native linux-aarch64 aapt2
# build (Google only publishes linux/x86_64, osx, windows). toolchain/aapt2-bin/aapt2
# wraps the official x86_64 aapt2 under qemu-x86_64-static. See BUILDING_IN_PROOT.md.
android.aapt2FromMavenOverride=/root/cooled/toolchain/aapt2-bin/aapt2
